<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Element Collector</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img src="icons/icon32.png" width="22" height="22" alt="">
        <span>Element Collector</span>
      </div>
      <div class="top-actions">
        <button id="openEditor" class="btn" type="button" title="Open the visual editor in a tab">Editor</button>
        <button id="pick" class="btn primary" type="button"></button>
      </div>
    </header>

    <nav class="modes" aria-label="Sections">
      <button type="button" data-mode="collect" class="on">Element Collector</button>
      <button type="button" data-mode="live">Live CSS</button>
    </nav>

    <div id="notice" class="notice" hidden></div>

    <main id="view"></main>
    <main id="liveView" hidden></main>

    <footer class="foot">
      <span>Funded by donations</span>
      <a id="donate" href="#" target="_blank" rel="noopener"></a>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="sidepanel.js"></script>
  <script src="livecss-panel.js"></script>
</body>
</html>
